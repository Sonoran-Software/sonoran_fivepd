name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Sonoran-Software/SonoranCADFiveM
          ref: 482316841a853210f861fa9135543a25675265bd
          path: cad-contract
      - name: Compile published FivePD API target
        run: |
          dotnet restore src_of_fivepd_plugin/SonoranPlugin.csproj --locked-mode
          dotnet build src_of_fivepd_plugin/SonoranPlugin.csproj -c Release --no-restore
          dotnet run --project tests/collector/CollectorTests.csproj -c Release
      - name: Test bridge and bundled CAD v2 SDK
        run: |
          python -m pip install lupa==2.8
          python tests/run.py cad-contract
      - name: Package
        run: |
          cp src_of_fivepd_plugin/bin/Release/net452/SonoranPlugin.net.dll put_in_fivepd_plugins/
          zip -r sonoran_fivepd.zip sonoran_fivepd put_in_fivepd_plugins docs README.md DEVELOPMENT.md RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: sonoran_fivepd
          path: sonoran_fivepd.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sonoran_fivepd
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" sonoran_fivepd.zip --verify-tag --title "FivePD Integration $RELEASE_TAG (Unsupported)" --notes-file RELEASE_NOTES.md --latest
